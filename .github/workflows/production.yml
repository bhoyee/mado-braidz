name: Test and deploy production

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      TEST_DATABASE_URL: mysql://root:ci-only-password@127.0.0.1:3306/mysql
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run test:db
      - name: Verify deployment and rollback without production access
        run: bash scripts/qa/deployment.sh
      - name: Package built release without credentials or local data
        shell: bash
        run: |
          bash -n scripts/deploy-production.sh
          bash -n scripts/run-deployment-queue.sh
          mkdir -p artifact
          tar -czf "artifact/$GITHUB_SHA.tar.gz" app.cjs package.json package-lock.json src scripts public
          cd artifact
          sha256sum "$GITHUB_SHA.tar.gz" > "$GITHUB_SHA.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-release
          path: artifact/
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-release
          path: artifact
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Deploy, migrate and verify the served revision
        shell: bash
        env:
          DEPLOY_PASSWORD: ${{ secrets.PRODUCTION_SSH_PASSWORD }}
          CPANEL_URL: ${{ vars.PRODUCTION_CPANEL_URL }}
          SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          tar -xOf "artifact/$GITHUB_SHA.tar.gz" scripts/ci/deploy-cpanel.js > deploy-cpanel.mjs
          node deploy-cpanel.mjs
