name: Test and deploy production

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      TEST_DATABASE_URL: mysql://root:ci-only-password@127.0.0.1:3306/mysql
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run test:db
      - name: Verify deployment and rollback without production access
        run: bash scripts/qa/deployment.sh
      - name: Package built release without credentials or local data
        shell: bash
        run: |
          bash -n scripts/deploy-production.sh
          mkdir -p artifact
          tar -czf "artifact/$GITHUB_SHA.tar.gz" app.cjs package.json package-lock.json src scripts public
          cd artifact
          sha256sum "$GITHUB_SHA.tar.gz" > "$GITHUB_SHA.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-release
          path: artifact/
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-release
          path: artifact
      - name: Deploy, migrate and verify the served revision
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          DEPLOY_PASSWORD: ${{ secrets.PRODUCTION_SSH_PASSWORD }}
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
          SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT }}
          SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          umask 077
          echo 'Runner public IPv4 (for hosting-provider SSH diagnostics):'
          curl --fail --silent --show-error --max-time 15 https://api.ipify.org || true
          echo
          python3 - <<'PY'
          import os, socket
          host = os.environ['SSH_HOST']
          print('Resolved SSH IPv4:', socket.gethostbyname(host), flush=True)
          try:
              with socket.create_connection((host, int(os.environ['SSH_PORT'])), timeout=20):
                  print('Production SSH port is reachable', flush=True)
          except OSError as error:
              raise SystemExit('Production SSH is unreachable from this runner before authentication: ' + str(error))
          PY
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          unset DEPLOY_KEY KNOWN_HOSTS
          printf '#!/bin/sh\nprintf "%%s\\n" "$DEPLOY_PASSWORD"\n' > ~/.ssh/askpass
          chmod 700 ~/.ssh/askpass
          export SSH_ASKPASS="$HOME/.ssh/askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          trap 'rm -f ~/.ssh/deploy_key ~/.ssh/askpass' EXIT
          ssh_options=(-i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 -o NumberOfPasswordPrompts=1 -o PreferredAuthentications=publickey,password,keyboard-interactive)
          host="$SSH_USER@$SSH_HOST"
          ssh "${ssh_options[@]}" -p "$SSH_PORT" "$host" 'mkdir -p /home/madoafri/mado-deploy/incoming /home/madoafri/mado-deploy/releases'
          scp "${ssh_options[@]}" -P "$SSH_PORT" artifact/* "$host:/home/madoafri/mado-deploy/incoming/"
          tar -xOf "artifact/$GITHUB_SHA.tar.gz" scripts/deploy-production.sh > deploy.sh
          ssh "${ssh_options[@]}" -p "$SSH_PORT" "$host" "bash -s -- $GITHUB_SHA" < deploy.sh
